<!DOCTYPE html>
<html lang="en">
<head>
      <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPW3JWMXQK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NPW3JWMXQK');

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pay ₹50 - LaptopRent</title>
  <style>
    :root {
      --primary: #0a84ff;
      --primary-hover: #0066cc;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #1c1c1e;
      --text-sub: #636366;
      --border: #e5e5ea;
      --success: #34c759;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    .checkout-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 390px;
      padding: 28px 22px;
      text-align: center;
      border: 1px solid var(--border);
      margin: auto;
    }

    .merchant-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0f7ff;
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .merchant-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .amount-display {
      font-size: 38px;
      font-weight: 800;
      color: var(--text-main);
      margin: 12px 0 18px;
      letter-spacing: -0.5px;
    }

    /* Mobile CTA */
    .mobile-pay-cta {
      display: none;
      margin-bottom: 18px;
    }

    .btn-pay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 15px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-pay:hover {
      background: #000;
    }

    .pay-with {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    .app-buttons {
      display: grid;
      gap: 10px;
    }

    /* QR Code Display */
    .qr-wrapper {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      display: inline-block;
      margin-bottom: 12px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }

    #qrcode img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }

    .scan-note {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* VPA Copy Bar */
    .vpa-box {
      background: #f4f4f6;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 8px;
    }

    .vpa-text {
      font-size: 13px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: var(--text-main);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-copy {
      background: #fff;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-copy:hover {
      background: #f0f7ff;
    }

    /* Trust Footer */
    .footer-trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: #8e8e93;
      padding-top: 12px;
      border-top: 1px solid #f2f2f7;
    }

    .footer-trust svg {
      width: 13px;
      height: 13px;
      fill: #8e8e93;
    }

    @media (max-width: 600px) {
      .mobile-pay-cta {
        display: block;
      }
      .divider-text {
        margin: 14px 0;
        font-size: 11px;
        color: var(--text-sub);
        display: flex;
        align-items: center;
        text-align: center;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .divider-text::before, .divider-text::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid var(--border);
      }
      .divider-text::before { margin-right: 10px; }
      .divider-text::after { margin-left: 10px; }
    }

    @media (max-height: 700px) and (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }
      .checkout-card {
        padding: 20px 16px;
        border-radius: 18px;
      }
      .amount-display {
        font-size: 32px;
        margin: 8px 0 14px;
      }
      .qr-wrapper {
        padding: 10px;
        margin-bottom: 8px;
      }
      #qrcode img {
        width: 160px !important;
        height: 160px !important;
      }
      .btn-pay {
        padding: 13px;
      }
    }
  </style>
</head>
<body>

<div class="checkout-card">
  <h2 class="merchant-name" id="display-name">LaptopRent</h2>
  <div class="amount-display" id="display-amount">₹50.00</div>

  <!-- Mobile Direct UPI Launcher -->
  <div class="mobile-pay-cta">
    <p class="pay-with">Pay with</p>
    <div class="app-buttons">
      <a id="btn-gpay" class="btn-pay" href="#">Google Pay</a>
      <a id="btn-phonepe" class="btn-pay" href="#">PhonePe</a>
      <a id="btn-paytm" class="btn-pay" href="#">Paytm</a>
    </div>
    <div class="divider-text">OR SCAN QR CODE</div>
  </div>

  <!-- QR Code Container -->
  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>
  <p class="scan-note">Scan with GPay, PhonePe, Paytm, or BHIM</p>

  <!-- UPI ID Copy Bar -->
  <div class="vpa-box">
    <span class="vpa-text" id="display-vpa">stagex271026@aubiz</span>
    <button class="btn-copy" id="copy-btn" onclick="copyUPI()">Copy</button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // Configuration
  const defaultVPA = "stagex271026@aubiz";
  const brandName = "LaptopRent";
  const defaultName = "StageX";
  const defaultAmount = "50.00";
  const defaultNote = "LaptopRent booking";

  // Read URL query params
  const urlParams = new URLSearchParams(window.location.search);
  const amount = urlParams.get('amount') || urlParams.get('am') || defaultAmount;
  const note = urlParams.get('note') || urlParams.get('tn') || defaultNote;
  const vpa = urlParams.get('vpa') || urlParams.get('pa') || defaultVPA;
  const name = urlParams.get('name') || urlParams.get('pn') || defaultName;

  // Update UI
  document.getElementById('display-name').textContent = brandName;
  document.getElementById('display-amount').textContent = "₹" + parseFloat(amount).toFixed(2);
  document.getElementById('display-vpa').textContent = vpa;

  // Build standard UPI URL
  const upiUrl = `upi://pay?pa=${encodeURIComponent(vpa)}&pn=${encodeURIComponent(name)}&am=${encodeURIComponent(amount)}&cu=INR&tn=${encodeURIComponent(note)}`;

  // App-specific buttons, so the payment opens in the chosen app
  // instead of whatever app the phone has set as default for UPI (e.g. WhatsApp)
  const upiQuery = upiUrl.split('?')[1];
  const isAndroid = /android/i.test(navigator.userAgent);
  const upiApps = {
    'btn-gpay':    { pkg: 'com.google.android.apps.nbu.paisa.user', ios: 'gpay://upi/pay?' },
    'btn-phonepe': { pkg: 'com.phonepe.app',                         ios: 'phonepe://pay?' },
    'btn-paytm':   { pkg: 'net.one97.paytm',                         ios: 'paytmmp://pay?' }
  };
  Object.keys(upiApps).forEach(id => {
    const app = upiApps[id];
    document.getElementById(id).href = isAndroid
      ? `intent://pay?${upiQuery}#Intent;scheme=upi;package=${app.pkg};end`
      : app.ios + upiQuery;
  });

  // Determine QR size based on window
  const isSmallScreen = window.innerHeight < 700 || window.innerWidth < 360;
  const qrSize = isSmallScreen ? 160 : 180;

  // Generate QR code
  if (window.QRCode) new QRCode(document.getElementById('qrcode'), {
    text: upiUrl,
    width: qrSize,
    height: qrSize,
    colorDark: "#111827",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });

  // Copy function
  function copyUPI() {
    navigator.clipboard.writeText(vpa).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = "Copied!";
      btn.style.color = "var(--success)";
      setTimeout(() => {
        btn.textContent = "Copy";
        btn.style.color = "var(--primary)";
      }, 2000);
    });
  }
</script>

</body>
</html>
